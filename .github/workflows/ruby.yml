name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby: [jruby-10.0.3.0, "3.2", "3.3", "3.4", "4.0"]
        faraday: ["~> 1", "~>2"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - name: Install dependencies
        run: bundle install
        env:
          FARADAY_VERSION: ${{ matrix.faraday}}
      - name: Start Solr
        run: docker compose up -d
      - name: Wait for Solr
        run: timeout 60 bash -c 'until curl -sf http://localhost:8983/solr/basic_configs/admin/ping; do sleep 2; done'
      - name: Run tests
        run: bundle exec rake
        env:
          FARADAY_VERSION: ${{ matrix.faraday}}
